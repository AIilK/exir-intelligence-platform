<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تابلوی تحقق هیبریدها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: an airport departures board. Rows are hybrid regions; the show zooms one row at a time into a full card,
   then a summary card closes each round. Deliberately dark-only (a wall/TV display). */
:root{
  --bg:#0a0c0f; --panel:#12161b; --panel2:#171c22; --tile:#1b2027; --tile2:#141920; --line:#262c34;
  --fg:#f3efe4; --muted:#8b939d; --amber:#ffc23d; --green:#3fd28a; --orange:#ff9f43; --red:#ff5a4e;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;gap:1.4vh;padding-block:1.6vh;max-width:1800px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--amber);padding-bottom:1.2vh}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:clamp(40px,5.2vh,58px);height:clamp(40px,5.2vh,58px);flex:none}
.brand h1{margin:0;font-size:clamp(18px,3vh,34px);font-weight:900;color:var(--amber);text-wrap:balance;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:clamp(12px,1.5vh,15px)}
.meta{display:flex;gap:clamp(14px,2vw,30px);align-items:center;flex-wrap:wrap}
.meta .k{font-size:clamp(11px,1.3vh,13px);color:var(--muted)}
.meta .v{font-size:clamp(16px,2.3vh,24px);font-weight:800;font-variant-numeric:tabular-nums}
#clock{font-size:clamp(22px,3.6vh,40px);font-weight:900;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* board */
.board{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);gap:.55vh}
.row{display:grid;grid-template-columns:4.2em minmax(0,2.4fr) 1.1fr 1.1fr 1.35fr .85fr 1.25fr;gap:12px;align-items:center;
  padding:0 14px;border-radius:6px;background:var(--panel);border:1px solid transparent;transition:border-color .3s,background .3s;
  font-size:clamp(12px,min(1.9vh,1.35vw),22px);min-height:0}
.row:nth-child(odd):not(.head){background:var(--panel2)}
.row.head{background:none;color:var(--amber);font-size:clamp(11px,1.4vh,14px);font-weight:700;letter-spacing:.02em}
.row.head div{white-space:nowrap}
.row.active{border-color:var(--amber);background:#1d1a10 !important;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #ffc23d33}}
.namecell{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.namecell .name{font-size:1.15em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namecell .sub{font-size:.62em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namecell.wipe{animation:wipe .7s ease-out both}
@keyframes wipe{from{clip-path:inset(0 0 0 100%);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

.tiles{display:flex;gap:2px;direction:ltr;justify-content:flex-end;font-variant-numeric:tabular-nums}
.t{display:inline-grid;place-items:center;min-width:.8em;height:1.45em;padding:0 2px;border-radius:3px;
  background:linear-gradient(var(--tile) 0 49%,#000 49% 51%,var(--tile2) 51%);font-weight:700;line-height:1}
.t.sep{background:none;min-width:.3em;padding:0}
.t.fa{animation:flipA .09s linear}.t.fb{animation:flipB .09s linear}
@keyframes flipA{from{transform:rotateX(70deg)}to{transform:none}}
@keyframes flipB{from{transform:rotateX(-70deg)}to{transform:none}}
.achcell{display:flex;flex-direction:column;gap:4px;min-width:0}
.achcell .tiles .t{color:var(--amber)}
.mini{position:relative;height:5px;background:var(--line);border-radius:3px}
.mini .f{position:absolute;inset-block:0;right:0;border-radius:3px;background:var(--amber);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.mini .m{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.muted{color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:.3em .7em;border-radius:4px;font-weight:800;font-size:.78em;white-space:nowrap}
.chip i{width:.55em;height:.55em;border-radius:50%;background:currentColor;flex:none}
.s-landed{color:#062b19;background:var(--green)}
.s-ontrack{color:var(--green);background:#3fd28a1c}
.s-behind{color:var(--orange);background:#ff9f431f}
.s-late{color:var(--red);background:#ff5a4e1f}
.s-none{color:var(--muted);background:#8b939d1f}
.s-late i{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* footer */
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:1vh}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:clamp(12px,1.5vh,15px)}
.ticker{flex:1;min-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font-size:clamp(12px,1.5vh,15px)}
.ticker b{color:var(--fg);font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:6px}
.ctl button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.ctl button:hover{border-color:var(--amber)}
.ctl button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;width:100%}
.prog div{height:100%;width:0;background:var(--amber)}
.msg{display:grid;place-items:center;text-align:center;color:var(--muted);font-size:18px;padding:40px;line-height:1.9}
.msg b{color:var(--red);display:block}

/* zoom card */
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:#000b;opacity:0;pointer-events:none;transition:opacity .5s}
.overlay.on{opacity:1;pointer-events:auto}
.card{width:min(1320px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--amber);border-radius:12px;
  transform-origin:center;will-change:transform}
.inner{padding:clamp(18px,3.4vh,40px) clamp(18px,3vw,44px);display:flex;flex-direction:column;gap:clamp(16px,3vh,30px);opacity:0;transition:opacity .35s}
.card.show .inner{opacity:1}
.chead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rank{font-size:clamp(26px,4.6vh,48px)}
.rank .t{color:var(--amber)}
.chead h2{margin:0;font-size:clamp(28px,6.4vh,66px);font-weight:900;line-height:1.1;text-wrap:balance}
.chead .sub{color:var(--muted);font-size:clamp(13px,1.8vh,17px);margin-top:4px}
.chead .chip{font-size:clamp(14px,2.2vh,22px);padding:8px 16px;margin-inline-start:auto}
.cbody{display:grid;grid-template-columns:minmax(220px,min(34vh,340px)) minmax(0,1fr);gap:clamp(18px,3vw,44px);align-items:center}
.gauge{position:relative;aspect-ratio:1;max-width:100%}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{fill:none;stroke:var(--line);stroke-width:14}
.gauge .exp{fill:none;stroke:#f3efe455;stroke-width:22}
.gauge .arc{fill:none;stroke:var(--amber);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.gauge .arc2{fill:none;stroke:var(--green);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.4s 1.3s cubic-bezier(.2,.8,.2,1)}
.gauge .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .big{font-size:clamp(40px,7.4vh,76px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.gauge .lbl{color:var(--muted);font-size:clamp(12px,1.6vh,15px);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 22px}
.stat{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.stat .k{font-size:clamp(12px,1.6vh,14px);color:var(--muted)}
.stat .v{font-size:clamp(18px,3.2vh,32px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .u{font-size:.45em;color:var(--muted);font-weight:500;margin-inline-start:4px}
.pace{margin-top:clamp(14px,2.4vh,24px)}
.pace .k{font-size:clamp(12px,1.5vh,14px);color:var(--muted);margin-bottom:22px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{position:relative;height:18px;background:var(--tile);border-radius:4px}
.bar .fill{position:absolute;inset-block:0;right:0;width:0;background:var(--amber);border-radius:4px;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bar .mark{position:absolute;top:-6px;bottom:-6px;width:3px;margin-right:-1.5px;background:var(--fg);border-radius:2px}
.bar .mark span{position:absolute;bottom:100%;right:50%;transform:translateX(50%);font-size:12px;white-space:nowrap;padding-bottom:3px}
.lower{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:clamp(18px,3vw,44px)}
.sec h3{margin:0 0 12px;font-size:clamp(13px,1.7vh,16px);color:var(--amber);font-weight:700}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 22px}
.g .gk{display:flex;justify-content:space-between;font-size:clamp(12px,1.6vh,15px);margin-bottom:5px;gap:8px}
.g .gk b{font-variant-numeric:tabular-nums}
.g .gq{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.g .bar{height:8px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:6px;font-size:clamp(13px,1.8vh,16px)}
.list .n{color:var(--amber);font-weight:900}
.list .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .vv{font-variant-numeric:tabular-nums;font-weight:700;text-align:left}
.list .vv small{display:inline-block;color:var(--muted);font-weight:500;margin-inline-start:12px;padding-inline-start:12px;border-inline-start:1px solid var(--line)}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cnt{padding:12px;border-radius:8px;background:var(--panel2);text-align:center}
.cnt .num{font-size:clamp(26px,4.6vh,48px);font-weight:900;line-height:1.1}
.cnt .chip{font-size:13px}

@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .board{grid-auto-rows:auto}
  .row{grid-template-columns:2.6em minmax(0,1fr) 6.5em 6.8em;gap:8px;padding:8px 10px;font-size:14px}
  .c-target,.c-sales,.c-pace{display:none}
  .cbody,.lower{grid-template-columns:1fr}
  .gauge{max-width:230px;margin:0 auto;width:100%}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .counts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .t.fa,.t.fb,.namecell.wipe,.row.active,.s-late i{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="12" fill="#ffc23d"/>
        <circle cx="29" cy="35" r="19" fill="none" stroke="#0a0c0f" stroke-width="4"/>
        <circle cx="29" cy="35" r="11" fill="none" stroke="#0a0c0f" stroke-width="4"/>
        <circle cx="29" cy="35" r="3.6" fill="#0a0c0f"/>
        <path d="M29 35 L50 14" stroke="#0a0c0f" stroke-width="4" stroke-linecap="round"/>
        <path d="M45 9 L55 9 L55 19" fill="none" stroke="#0a0c0f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>تابلوی تحقق تارگت هیبریدها</h1>
        <p id="subtitle">فروش ناخالص در برابر تارگت ریالی · مبالغ به میلیون تومان</p>
      </div>
    </div>
    <div class="meta">
      <div><div class="k">ماه</div><div class="v" id="month">—</div></div>
      <div><div class="k">روز کاری</div><div class="v" id="days">—</div></div>
      <div><div class="k">تحقق کل</div><div class="v" id="totalPct" style="color:var(--amber)">—</div></div>
      <div><div class="k">تحقق تا امروز</div><div class="v" id="totalPace">—</div></div>
      <div id="clock"></div>
    </div>
  </header>

  <main class="board" id="board" aria-label="فهرست هیبریدها"><div class="msg">در حال خواندن داده…</div></main>

  <footer class="foot">
    <div class="legend" id="legend"></div>
    <div class="ticker" id="ticker"></div>
    <div class="ctl">
      <button id="bPrev" type="button">▶ قبلی</button>
      <button id="bPlay" type="button">مکث</button>
      <button id="bNext" type="button">بعدی ◀</button>
      <button id="bFull" type="button">تمام‌صفحه</button>
    </div>
    <div class="prog"><div id="prog"></div></div>
  </footer>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"><div class="inner" id="inner"></div></div></div>

<script>
(() => {
const HOLD = 9000, SUMMARY_HOLD = 11000, REFRESH_EVERY = 5 * 60 * 1000;
const MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const STATUS = {landed:"تارگت محقق شد", ontrack:"در مسیر", behind:"تأخیر جزئی", late:"تأخیر", none:"بدون تارگت"};
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fa = (n, f=0) => Number(n).toLocaleString("fa-IR",{maximumFractionDigits:f,minimumFractionDigits:f});
const faInt = n => n == null ? "—" : fa(Math.round(n));
const pct = x => x == null ? "—" : faInt(x*100) + "٪";
const pad2 = n => fa(n).padStart(2,"۰");
const chip = s => `<span class="chip s-${s}"><i></i>${STATUS[s]}</span>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const month = new URLSearchParams(location.search).get("month");

let DATA = null, D = [], rows = [], SHARE = 1, lastFetch = 0;

/* ---------- split-flap tiles ---------- */
const DIG = "۰۱۲۳۴۵۶۷۸۹";
function flap(el, text, delay=0){
  el.innerHTML = "";
  [...text].forEach((ch, i) => {
    const s = document.createElement("span");
    const isDig = DIG.includes(ch);
    s.className = "t" + (!isDig && "٬٫/".includes(ch) ? " sep" : "");
    s.textContent = isDig && !reduce ? DIG[(Math.random()*10)|0] : ch;
    el.appendChild(s);
    if (!isDig || reduce) return;
    const stopAt = performance.now() + delay + 250 + i*70 + Math.random()*300;
    let alt = false;
    const tick = () => {
      if (performance.now() >= stopAt){ s.textContent = ch; s.className = "t " + (alt?"fa":"fb"); return; }
      s.textContent = DIG[(Math.random()*10)|0];
      s.className = "t " + ((alt = !alt) ? "fa" : "fb");
      setTimeout(tick, 70);
    };
    setTimeout(tick, delay);
  });
}

/* ---------- data ---------- */
async function load(){
  const r = await fetch("/api/board" + (month ? "?month=" + encodeURIComponent(month) : ""), {cache:"no-store"});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  DATA = j; D = j.branches; lastFetch = Date.now();
  SHARE = j.wd_total ? j.wd_elapsed / j.wd_total : 1;
  renderBoard();
}
function totals(){
  const t = D.filter(d => d.target);
  const T = t.reduce((a,d) => a + d.target, 0), S = t.reduce((a,d) => a + d.gross, 0);
  const counts = {landed:0, ontrack:0, behind:0, late:0, none:0};
  D.forEach(d => counts[d.status]++);
  return {T, S, ach: T ? S/T : null, pace: T && SHARE ? S/(T*SHARE) : null, counts};
}

/* ---------- board ---------- */
const board = $("board");
function renderBoard(){
  const [y, m] = (DATA.month || "").split("/");
  $("month").textContent = m ? `${MONTHS[+m-1]} ${fa(+y).replace(/٬/g,"")}` : "—";
  $("days").textContent = `${fa(DATA.wd_elapsed)} از ${fa(DATA.wd_total)}`;
  const tt = totals();
  $("totalPct").textContent = pct(tt.ach);
  $("totalPace").textContent = pct(tt.pace);
  $("subtitle").textContent = `فروش ناخالص (برگشتی‌ها کسر) در برابر تارگت ریالی · میلیون تومان · به‌روزرسانی ${String(DATA.fetched_at).replace(/\d/g, c => DIG[c])}`;
  $("legend").innerHTML = ["landed","ontrack","behind","late"].map(s => `<span class="chip s-${s}"><i></i>${STATUS[s]} ${fa(tt.counts[s])}</span>`).join("");
  $("ticker").innerHTML = `مجموع تارگت <b>${faInt(tt.T)}</b> · فروش <b>${faInt(tt.S)}</b> · انتظار تا امروز <b>${faInt(tt.T*SHARE)}</b> · مانده <b>${faInt(Math.max(0, tt.T - tt.S))}</b>`;

  board.innerHTML = `<div class="row head"><div>ردیف</div><div>هیبرید</div><div class="c-target">تارگت ماه</div><div class="c-sales">فروش تا امروز</div><div>تحقق ماه</div><div class="c-pace">تا امروز</div><div>وضعیت</div></div>`;
  rows = D.map(d => {
    const r = document.createElement("div");
    r.className = "row";
    const sub = [d.supervisors.length ? "سرپرست: " + d.supervisors.join("، ") : "", d.visitors ? fa(d.visitors) + " ویزیتور" : ""].filter(Boolean).join(" · ");
    r.innerHTML = `<div class="tiles c-no"></div>
      <div class="namecell"><span class="name">${esc(d.name)}</span><span class="sub">${esc(sub)}</span></div>
      <div class="tiles c-target"></div><div class="tiles c-sales"></div>
      <div class="achcell"><div class="tiles pct"></div><div class="mini"><div class="f"></div><div class="m" style="right:${SHARE*100}%"></div></div></div>
      <div class="tiles c-pace"></div>
      <div>${chip(d.status)}</div>`;
    board.appendChild(r);
    return r;
  });
  flipBoard();
}
function flipBoard(){
  rows.forEach((r, i) => {
    const d = D[i], dl = i*110;
    flap(r.querySelector(".c-no"), pad2(d.rank), dl);
    flap(r.querySelector(".c-target"), faInt(d.target), dl+80);
    flap(r.querySelector(".c-sales"), faInt(d.gross), dl+160);
    flap(r.querySelector(".pct"), pct(d.ach), dl+240);
    flap(r.querySelector(".c-pace"), pct(d.pace), dl+320);
    const f = r.querySelector(".mini .f");
    f.style.width = "0";
    setTimeout(() => { f.style.width = Math.min(100, (d.ach||0)*100) + "%"; f.style.background = barColor(d.status); }, dl + 300);
    const n = r.querySelector(".namecell");
    n.classList.remove("wipe"); void n.offsetWidth;
    n.style.animationDelay = dl + "ms"; n.classList.add("wipe");
  });
}
function barColor(s){ return s === "landed" || s === "ontrack" ? "var(--green)" : s === "behind" ? "var(--amber)" : s === "late" ? "var(--red)" : "var(--muted)"; }
const clockFmt = new Intl.DateTimeFormat("fa-IR",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
const tickClock = () => $("clock").textContent = clockFmt.format(new Date());
tickClock(); setInterval(tickClock, 1000);

/* ---------- cards ---------- */
const overlay = $("overlay"), card = $("card"), inner = $("inner");
const C = 2*Math.PI*86;
const stat = (k, v, u="م.ت") => `<div class="stat"><div class="k">${k}</div><div class="v">${v == null ? "—" : `<span data-count="${v}">۰</span>`}<span class="u">${u}</span></div></div>`;
function gauge(ach, label){
  // نشانگر روشن روی دایره = جایی که تا امروز باید می‌رسید
  const e = Math.min(1, SHARE), arcLen = 3;
  return `<div class="gauge"><svg viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="86"/>
      <circle class="exp" cx="100" cy="100" r="86" stroke-dasharray="${arcLen} ${C}" stroke-dashoffset="${-(C*e - arcLen/2)}"/>
      <circle class="arc" cx="100" cy="100" r="86" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-ach="${ach ?? 0}"/>
      <circle class="arc2" cx="100" cy="100" r="86" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
    <div class="mid"><div class="big">${ach == null ? "—" : `<span data-count="${ach*100}">۰</span>٪`}</div><div class="lbl">${label}</div></div></div>`;
}
function paceBar(ach){
  return `<div class="pace"><div class="k"><span>پیشرفت ماه</span><span>خط سفید = جایی که تا امروز باید می‌رسید</span></div>
    <div class="bar"><div class="fill" data-w="${Math.min(100, (ach||0)*100)}"></div>
    <div class="mark" style="right:${SHARE*100}%"><span>${faInt(SHARE*100)}٪</span></div></div></div>`;
}
function cardHTML(d){
  const left = d.target ? Math.max(0, d.target - d.gross) : null;
  const daysLeft = DATA.wd_total - DATA.wd_elapsed;
  const perDay = left != null && daysLeft > 0 ? left / daysLeft : null;
  const sub = [d.supervisors.length ? "سرپرست: " + d.supervisors.join("، ") : "", d.visitors ? fa(d.visitors) + " ویزیتور" : "", d.customers ? fa(d.customers) + " مشتری" : ""].filter(Boolean).join(" · ");
  const groups = d.groups.length ? `<div class="groups">${d.groups.map(g => `<div class="g">
      <div class="gk"><span>${esc(g.key)}</span><b>${pct(g.ach)}</b></div>
      <div class="bar"><div class="fill" data-w="${Math.min(100, g.ach*100)}" style="background:${g.ach >= SHARE ? "var(--green)" : g.ach >= SHARE*.9 ? "var(--amber)" : "var(--red)"}"></div></div>
      <div class="gq">${faInt(g.qty)} از ${faInt(g.target)} عدد</div></div>`).join("")}</div>`
    : `<div class="muted">برای این هیبرید تارگت تعدادی ثبت نشده است.</div>`;
  const top = d.top.length ? `<ol class="list">${d.top.map((v,i) => `<li><span class="n">${fa(i+1)}</span><span class="nm">${esc(v.name)}</span>
      <span class="vv">${faInt(v.gross)}${v.ach != null ? `<small>${pct(v.ach)}</small>` : ""}</span></li>`).join("")}</ol>` : `<div class="muted">فروشی ثبت نشده است.</div>`;
  return `
  <div class="chead">
    <div class="tiles rank" id="cRank"></div>
    <div><h2>${esc(d.name)}</h2><div class="sub">${esc(sub)}</div></div>
    ${chip(d.status)}
  </div>
  <div class="cbody">
    ${gauge(d.ach, "تحقق تارگت ماه")}
    <div>
      <div class="stats">
        ${stat("تارگت ماه", d.target)}
        ${stat("فروش ناخالص تا امروز", d.gross)}
        ${stat("تحقق تا امروز", d.pace == null ? null : d.pace*100, "٪")}
        ${stat("انتظار تا امروز", d.target_day)}
        ${stat("مانده تا تارگت", left)}
        ${stat(`لازم در هر روز (${fa(daysLeft)} روز مانده)`, perDay)}
      </div>
      ${paceBar(d.ach)}
    </div>
  </div>
  <div class="lower">
    <div class="sec"><h3>تحقق تارگت تعدادی گروه‌های کالا</h3>${groups}</div>
    <div class="sec"><h3>بیشترین فروش ویزیتورها</h3>${top}</div>
  </div>`;
}
function summaryHTML(){
  const tt = totals();
  const ranked = D.filter(d => d.ach != null);
  const li = (d, i) => `<li><span class="n">${fa(i)}</span><span class="nm">${esc(d.name)}</span><span class="vv">${pct(d.ach)}<small>${faInt(d.gross)}</small></span></li>`;
  return `
  <div class="chead">
    <div><h2>جمع همه هیبریدها</h2><div class="sub">${fa(D.length)} هیبرید · روز کاری ${fa(DATA.wd_elapsed)} از ${fa(DATA.wd_total)}</div></div>
  </div>
  <div class="cbody">
    ${gauge(tt.ach, "تحقق تارگت ماه")}
    <div>
      <div class="stats">
        ${stat("تارگت ماه", tt.T)}
        ${stat("فروش ناخالص تا امروز", tt.S)}
        ${stat("تحقق تا امروز", tt.pace == null ? null : tt.pace*100, "٪")}
      </div>
      ${paceBar(tt.ach)}
      <div class="counts" style="margin-top:22px">${["landed","ontrack","behind","late"].map(s => `<div class="cnt"><div class="num" style="color:${barColor(s)}">${fa(tt.counts[s])}</div>${chip(s)}</div>`).join("")}</div>
    </div>
  </div>
  <div class="lower" style="grid-template-columns:1fr 1fr">
    <div class="sec"><h3>بالاترین تحقق</h3><ol class="list">${ranked.slice(0,3).map((d,i) => li(d, i+1)).join("")}</ol></div>
    <div class="sec"><h3>پایین‌ترین تحقق</h3><ol class="list">${ranked.slice(-3).reverse().map((d,i) => li(d, ranked.length - i)).join("")}</ol></div>
  </div>`;
}
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, t0 = performance.now(), dur = reduce ? 0 : 1400;
    const step = now => {
      const p = dur ? Math.min(1, (now - t0)/dur) : 1, e = 1 - Math.pow(1-p, 3);
      el.textContent = faInt(to*e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function animateIn(rank){
  const arc = inner.querySelector(".arc"), arc2 = inner.querySelector(".arc2"), ach = +arc.dataset.ach;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    arc.style.strokeDashoffset = C * (1 - Math.min(1, ach));
    if (ach > 1) arc2.style.strokeDashoffset = C * (1 - Math.min(1, ach - 1));
    inner.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%");
  }));
  if (rank) flap($("cRank"), pad2(rank));
  countUp(inner);
}
const EASE = "cubic-bezier(.2,.8,.2,1)";
function fromEl(el){
  const f = card.getBoundingClientRect(), r = el.getBoundingClientRect();
  const dx = (r.left + r.width/2) - (f.left + f.width/2), dy = (r.top + r.height/2) - (f.top + f.height/2);
  return `translate(${dx}px,${dy}px) scale(${Math.max(.02, r.width/f.width)},${Math.max(.02, r.height/f.height)})`;
}
async function openCard(html, from, rank, my){
  inner.innerHTML = html;
  card.classList.remove("show");
  card.scrollTop = 0;
  overlay.classList.add("on");
  if (!reduce) await card.animate([{transform:fromEl(from)},{transform:"none"}],{duration:900,easing:EASE}).finished.catch(() => {});
  if (my !== token) return;
  card.classList.add("show");
  animateIn(rank);
}
async function closeCard(to){
  card.classList.remove("show");
  await sleep(300);
  overlay.classList.remove("on");
  if (!reduce && to) await card.animate([{transform:"none"},{transform:fromEl(to)}],{duration:700,easing:"cubic-bezier(.6,0,.8,.4)",fill:"forwards"}).finished.catch(()=>{});
  card.getAnimations().forEach(a => a.cancel());
}

/* ---------- show loop ---------- */
let paused = false, token = 0, cur = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function wait(ms, my, bar){
  let left = ms;
  while (left > 0){
    if (my !== token) return false;
    await sleep(100);
    if (!paused) left -= 100;
    if (bar) $("prog").style.width = (100 - left/ms*100) + "%";
  }
  return my === token;
}
async function showSummary(my){
  const from = $("ticker");
  cur = -1;
  await openCard(summaryHTML(), from, null, my);
  if (my !== token) return false;
  $("prog").style.width = "0";
  if (!await wait(SUMMARY_HOLD, my, true)) return false;
  await closeCard(from); cur = null;
  return my === token;
}
async function run(start, intro){
  const my = ++token;
  if (intro && !await wait(D.length*110 + 2600, my)) return;
  for (let i = start; ; i++){
    if (i >= D.length){
      if (!await showSummary(my)) return;
      if (Date.now() - lastFetch > REFRESH_EVERY){ try { await load(); } catch(e){ flipBoard(); } }
      else flipBoard();
      if (!await wait(D.length*110 + 3000, my)) return;
      i = -1; continue;
    }
    rows.forEach(r => r.classList.remove("active"));
    rows[i].classList.add("active");
    rows[i].scrollIntoView({block:"nearest",behavior:"smooth"});
    if (!await wait(900, my)) return;
    cur = i;
    await openCard(cardHTML(D[i]), rows[i], D[i].rank, my);
    if (my !== token) return;
    $("prog").style.width = "0";
    if (!await wait(HOLD, my, true)) return;
    await closeCard(rows[i]); cur = null;
    rows[i].classList.remove("active");
    if (!await wait(500, my)) return;
  }
}
let jumping = false;
async function jump(delta){
  if (!D.length || jumping) return;
  jumping = true;
  // جای فعلی: کارت باز، یا ردیف هایلایت؛ کارت جمع = D.length
  let base = cur === -1 ? D.length : cur ?? rows.findIndex(r => r.classList.contains("active"));
  token++;
  card.getAnimations().forEach(a => a.cancel());
  if (overlay.classList.contains("on")) await closeCard(base >= 0 && base < D.length ? rows[base] : $("ticker"));
  cur = null;
  rows.forEach(r => r.classList.remove("active"));
  jumping = false;
  const n = D.length + 1;  // ردیف‌ها + کارت جمع
  run((((base < 0 ? -1 : base) + delta) % n + n) % n, false);
}
$("bNext").onclick = () => jump(1);
$("bPrev").onclick = () => jump(-1);
$("bPlay").onclick = () => { paused = !paused; $("bPlay").textContent = paused ? "ادامه" : "مکث"; };
$("bFull").onclick = () => { const p = document.documentElement.requestFullscreen?.(); p && p.catch(() => {}); };
document.addEventListener("keydown", e => {
  if (e.key === " "){ e.preventDefault(); $("bPlay").click(); }
  if (e.key === "ArrowLeft") jump(1);
  if (e.key === "ArrowRight") jump(-1);
});

(async function boot(){
  try { await load(); }
  catch(e){
    board.innerHTML = `<div class="msg"><b>داده خوانده نشد</b>${esc(e.message)}<br>تا ۳۰ ثانیه دیگر دوباره تلاش می‌شود.</div>`;
    setTimeout(boot, 30000);
    return;
  }
  if (!D.length){ board.innerHTML = `<div class="msg">برای این ماه هیبریدی با فروش پیدا نشد.</div>`; return; }
  run(0, true);
})();
})();
</script>
